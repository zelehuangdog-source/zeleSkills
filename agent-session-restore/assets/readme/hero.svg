<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">claude-session-restore</title>
  <desc id="desc">重启前存档、重启后把 Warp 里所有 Claude Code 会话连同真实分屏布局精确 resume 接回。右侧展示一个 Warp tab 的分屏树，每个格子里绑定一枚 session id。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#0E131C"/>
    </linearGradient>
    <linearGradient id="matchline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46D3A6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#46D3A6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="25.5" fill="none" stroke="#1B2230" stroke-width="1"/>

  <!-- ===== Left: title block ===== -->
  <g transform="translate(64 66)">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="15" letter-spacing="3" fill="#46D3A6">CLAUDE CODE</text>
    <text x="128" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="15" letter-spacing="3" fill="#4B5568">·  WARP 终端  ·  会话存档 / 恢复</text>

    <text x="-2" y="70" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif"
          font-size="46" font-weight="700" fill="#E6EDF3">存档一次，重启后</text>
    <text x="-2" y="126" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif"
          font-size="46" font-weight="700" fill="#E6EDF3">所有会话<tspan fill="#46D3A6">原样接回</tspan></text>

    <text x="0" y="176" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif"
          font-size="18" fill="#9AA4B2">十几个分屏、每格一个 session —— 靠 UUID 精确匹配，</text>
    <text x="0" y="204" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif"
          font-size="18" fill="#9AA4B2">恢复时每个格子自动 <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#CBD5E1">--resume &lt;id&gt;</tspan> 接回原上下文。</text>

    <!-- repo name chip -->
    <g transform="translate(0 236)">
      <rect x="0" y="0" width="290" height="34" rx="8" fill="#121722" stroke="#232B39"/>
      <circle cx="18" cy="17" r="4" fill="#46D3A6"/>
      <text x="34" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="15" fill="#CBD5E1">claude-session-restore</text>
    </g>
    <text x="306" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="13" fill="#5A6473">macOS · Python3</text>
  </g>

  <!-- ===== Right: a Warp tab with a real split-pane tree ===== -->
  <g transform="translate(690 60)">
    <!-- window card -->
    <rect x="0" y="0" width="446" height="260" rx="14" fill="#121722" stroke="#242D3C"/>
    <!-- title bar -->
    <path d="M0 14 A14 14 0 0 1 14 0 H432 A14 14 0 0 1 446 14 V40 H0 Z" fill="#0F141D"/>
    <circle cx="22" cy="20" r="5" fill="#3A4150"/>
    <circle cx="40" cy="20" r="5" fill="#3A4150"/>
    <circle cx="58" cy="20" r="5" fill="#3A4150"/>
    <text x="223" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="13" fill="#7D8590">Warp — 1 tab · 3 panes</text>

    <!-- split-pane tree: left tall pane + right column split into two -->
    <!-- pane A (left, tall) -->
    <g transform="translate(14 52)">
      <rect x="0" y="0" width="204" height="194" rx="8" fill="#0E131C" stroke="#232B39"/>
      <text x="14" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#E6EDF3">settle-account</text>
      <text x="14" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#5A6473">~/IdeaProjects/settle…</text>
      <!-- session id chip -->
      <rect x="14" y="150" width="176" height="30" rx="7" fill="#0C1A16" stroke="#1E5A47"/>
      <path d="M26 165 l4 4 l7 -8" fill="none" stroke="#46D3A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#46D3A6">a3f1··9c2  --resume</text>
    </g>

    <!-- pane B (top right) -->
    <g transform="translate(228 52)">
      <rect x="0" y="0" width="204" height="92" rx="8" fill="#0E131C" stroke="#232B39"/>
      <text x="14" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#E6EDF3">sqt-ent</text>
      <rect x="14" y="50" width="176" height="28" rx="7" fill="#0C1A16" stroke="#1E5A47"/>
      <path d="M26 64 l4 4 l7 -8" fill="none" stroke="#46D3A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#46D3A6">7b0e··d41  --resume</text>
    </g>

    <!-- pane C (bottom right) -->
    <g transform="translate(228 154)">
      <rect x="0" y="0" width="204" height="92" rx="8" fill="#0E131C" stroke="#232B39"/>
      <text x="14" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#E6EDF3">tspBase</text>
      <rect x="14" y="50" width="176" height="28" rx="7" fill="#0C1A16" stroke="#1E5A47"/>
      <path d="M26 64 l4 4 l7 -8" fill="none" stroke="#46D3A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#46D3A6">e92c··5aa  --resume</text>
    </g>
  </g>
</svg>
